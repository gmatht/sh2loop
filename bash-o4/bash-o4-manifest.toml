# bash-o4-manifest.toml — hash-pinned fetch manifest (docs/BASH-O4.md §4.6).
#
# Every entry with a `sha256` pin may be auto-fetched (consent policy in
# `bash-O4 --fetch-libs`). Entries WITHOUT a pin are ALWAYS refused:
# an unpinned upstream cannot be verified. Pin new upstreams by fetching
# once over a trusted link, recording `sha256sum` + `size` here.

[[lib]]
name = "volk.h"
version = "master-20260913"
url = "https://raw.githubusercontent.com/zeux/volk/master/volk.h"
sha256 = "dc2cb753d467353380dc4384ca479551a2a527b32b80527f8aee312de6510a78"
size = 194818
kind = "header"
license = "MIT"

[[lib]]
name = "volk.c"
version = "master-20260913"
url = "https://raw.githubusercontent.com/zeux/volk/master/volk.c"
sha256 = "64159146b843e1b3d9f5dc14035b2716e16868b9e5ec4d7aef8f57f6b674a875"
size = 348538
kind = "lib"
license = "MIT"

# SPIR-V compiler (system glslangValidator preferred; fetched only when
# absent). PINNED: KhronosGroup/glslang 16.6.0, the Linux x86_64 release
# tarball from that tag's GitHub release. The sha256 is of those exact
# bytes; `fetch` re-verifies it on every use and `toolchain` entries are
# unpacked so `<cache>/bash-o4-fetch/glslang/bin/glslangValidator` is the
# path `shader::find_spirv_compiler` looks for. 16.6.0 is newer than the
# compiler that produced the committed .spv files (15.1.0), which is why
# those bytes are regenerated and byte-compared by
# `tests/fb_spv_regen.rs` rather than assumed to match.
[[lib]]
name = "glslang"
version = "16.6.0"
url = "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz"
sha256 = "2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce"
size = 7923164
kind = "toolchain"
license = "Apache-2.0"
