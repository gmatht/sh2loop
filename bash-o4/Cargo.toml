[package]
name = "bash-o4"
version = "0.1.1"
edition = "2021"
description = "The -O4 driver family (bash-O4 / python-O4): shell or Python → ShIR → C (tcc JIT/AOT) and transpiled CUDA (PTX), plus GLSL-450 emission and Vulkan dispatch."
readme = "README.md"
# NO `license` / `license-file` key yet, deliberately.  bash-o4 links the
# sh2perl core, whose LICENSE states GPL-3 with an additional Apache-2.0
# permission for named paid-work recipients and their subrecipients — that
# expression has no single SPDX id, and a wrong or missing declaration is
# worse than none.  Settle it before the release (most likely
# `license-file` pointing at a copy of `../sh2perl/LICENSE`).
# Not `cargo publish`-able: the workspace crates are path dependencies
# (`../sh2perl`, `../otranspilerl`) and the frontend binaries are built
# separately (see README "Build & quickstart").  The `[workspace]` table
# below keeps this a standalone workspace so `cargo build`/`test` here do
# not pull the parent tree.

[workspace]

[lib]
name = "bash_o4"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "bash-O4"
path = "src/main.rs"

[[bin]]
name = "python-O4"
path = "src/main_py.rs"

[dependencies]
# Only for `restore_sigpipe_default` (see lib.rs): Rust ignores SIGPIPE, so
# piping our output into a reader that exits early panicked instead of
# dying quietly like every other Unix tool.
libc = "0.2"
otranspilerl = { path = "../otranspilerl" }
debashl = { path = "../sh2perl" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
